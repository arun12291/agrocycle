# =====================================================
# AgroCycle Application Configuration
# =====================================================
spring.application.name=agrocycle
server.port=${SERVER_PORT:8080}

# =====================================================
# Database Configuration
# Read from environment variables for security
# =====================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agrocycle_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:agrocycle_user}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# =====================================================
# JPA / Hibernate Configuration
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =====================================================
# File Upload Configuration
# =====================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Upload directory (relative to working directory, or absolute)
agrocycle.upload.dir=${UPLOAD_DIR:uploads}
agrocycle.upload.max-size-bytes=10485760
agrocycle.upload.allowed-types=image/jpeg,image/png,image/webp,image/gif

# =====================================================
# Spring Security Session
# =====================================================
server.servlet.session.timeout=86400s
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# =====================================================
# Email Configuration (SMTP)
# Set MAIL_ENABLED=false to skip email in development
# =====================================================
agrocycle.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
agrocycle.mail.from=${MAIL_FROM:noreply@agrocycle.com}
agrocycle.mail.from-name=AgroCycle Platform

# =====================================================
# Delivery Matching Configuration
# =====================================================
agrocycle.delivery.offer-timeout-minutes=${DELIVERY_OFFER_TIMEOUT:30}
agrocycle.delivery.max-candidates=5
agrocycle.delivery.retry-interval-minutes=60

# =====================================================
# Logging
# =====================================================
logging.level.com.agrocycle=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
